runtime: custom
env: flex

entrypoint: gunicorn -k eventlet -b :$PORT app:app

instance_class: F1

env_variables:
  SECRET_KEY: ${SECRET_KEY}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_NAME: ${DB_NAME}
  SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
  UPLOAD_FOLDER: static/uploads

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto

resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 3
  cool_down_period_sec: 90

  cpu_utilization:
    target_utilization: 0.65